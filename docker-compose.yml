# shot by sardor — full stack (Postgres + Next.js app).
# Ishga tushirish:  docker compose up -d --build
# To'xtatish:      docker compose down
# Log ko'rish:     docker compose logs -f app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shotbysardor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shotbysardor}
      POSTGRES_DB: shotbysardor
    volumes:
      - shotbysardor_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotbysardor -d shotbysardor"]
      interval: 5s
      timeout: 3s
      retries: 20
    # `ports` ni prod'da tashqariga chiqarmaymiz — faqat ichki `db` xosti orqali.
    # Local dev'da xohlasangiz shu blokni ochib qo'ying:
    # ports:
    #   - "5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Konteyner ichidagi user UID/GID — host bind mount bilan mos bo'lishi uchun.
        # `HOST_UID` va `HOST_GID` ni `.env` orqali override qilish mumkin
        # (masalan `echo "HOST_UID=$(id -u)" >> .env`).
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DB URL — container tarmog'i orqali `db` xosti bilan.
      DATABASE_URL: postgresql://shotbysardor:${POSTGRES_PASSWORD:-shotbysardor}@db:5432/shotbysardor
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin12345}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_PRIVATE: ${R2_BUCKET_PRIVATE:-}
      R2_BUCKET_PUBLIC: ${R2_BUCKET_PUBLIC:-}
      R2_PUBLIC_CDN_URL: ${R2_PUBLIC_CDN_URL:-}
      MAX_PHOTO_MB: ${MAX_PHOTO_MB:-60}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-2048}
      MAX_RECEIPT_MB: ${MAX_RECEIPT_MB:-10}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # `STORAGE_DRIVER=local` bo'lganda barcha yuklamalar (originallar, preview,
      # kvitansiyalar) HOST-dagi `./storage` papkasida saqlanadi. Bind mount tanlanishining
      # sababi: named volume ishlatilganda host-dagi papka bilan sinxron bo'lmaydi va
      # avval yuklangan kontent konteynerga ko'rinmaydi. Bind mount host bilan bir manba,
      # backup olish oson (rsync/cp), git tarixiga ta'siri yo'q (`.gitignore`-da).
      - ./storage:/app/storage

volumes:
  shotbysardor_db:
